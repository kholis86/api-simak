version: '3.8'

services:
  api:
    image: ${DOCKER_REGISTRY:-localhost}/api-simak:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # Tambahkan variabel lingkungan lainnya di sini atau gunakan secrets
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - app-network

networks:
  app-network:
    driver: overlay

# Note: Untuk database di Swarm, disarankan pakai Managed DB DigitalOcean.
# Kalau mau tetap pakai container, pastikan pakai placement constraints 
# supaya DB tidak pindah-pindah node dan kehilangan data.
